<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz das Cores: Rico x Pobre 🎁</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --rosa: #FF3D77;
            --rosa-clara: #FF6FA5;
            --laranja: #FF8C42;
            --laranja-clara: #FFB25E;
            --gradiente-principal: linear-gradient(135deg, var(--rosa), var(--laranja));
            --gradiente-suave: linear-gradient(135deg, rgba(255,61,119,0.9), rgba(255,140,66,0.9));
            --vidro: rgba(255,255,255,0.08);
            --vidro-borda: rgba(255,255,255,0.22);
            --sombra-premium: 0 25px 60px -12px rgba(0,0,0,0.55);
            --brilho-rosa: 0 8px 30px -6px rgba(255,61,119,0.55);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 12px;
            text-align: center;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(255,140,66,0.30), transparent 45%),
                radial-gradient(circle at 85% 10%, rgba(255,61,119,0.35), transparent 45%),
                radial-gradient(circle at 50% 100%, rgba(120,40,180,0.4), transparent 55%),
                linear-gradient(160deg, rgba(26,11,46,0.82) 0%, rgba(43,15,58,0.78) 45%, rgba(58,17,80,0.78) 100%),
                url('img/fundo-quarto.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: grid;
            grid-template-columns: auto auto;
            align-items: stretch;
            align-content: center;
            justify-content: center;
            gap: 20px;
        }

        /* Manchas de gradiente flutuando no fundo, dando profundidade "premium" */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
            animation: flutuarBlob 12s ease-in-out infinite;
        }
        .blob1 { width: 320px; height: 320px; background: var(--rosa); top: -80px; left: -80px; }
        .blob2 { width: 380px; height: 380px; background: var(--laranja); bottom: -100px; right: -100px; animation-delay: 2s; }
        .blob3 { width: 260px; height: 260px; background: #a83aff; top: 40%; left: 50%; animation-delay: 4s; }

        @keyframes flutuarBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
        }

        /* Textura de fundo: presentes, laços e estrelinhas em vetor, bem sutil */
        .textura-fundo {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.10;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220"><g fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(20,30) rotate(-8)"><rect x="0" y="14" width="34" height="26" rx="3"/><rect x="0" y="14" width="34" height="9"/><line x1="17" y1="14" x2="17" y2="40"/><circle cx="13" cy="8" r="5"/><circle cx="21" cy="8" r="5"/></g><g transform="translate(150,20) scale(0.9)"><path d="M14 0 L17 10 L28 10 L19 16 L22 27 L14 20 L6 27 L9 16 L0 10 L11 10 Z"/></g><g transform="translate(120,110) rotate(10) scale(0.8)"><rect x="0" y="14" width="34" height="26" rx="3"/><rect x="0" y="14" width="34" height="9"/><line x1="17" y1="14" x2="17" y2="40"/><circle cx="13" cy="8" r="5"/><circle cx="21" cy="8" r="5"/></g><circle cx="60" cy="150" r="3" fill="white" stroke="none"/><circle cx="190" cy="90" r="2.5" fill="white" stroke="none"/><circle cx="40" cy="190" r="2" fill="white" stroke="none"/><g transform="translate(60,180) scale(0.5)"><path d="M14 0 L17 10 L28 10 L19 16 L22 27 L14 20 L6 27 L9 16 L0 10 L11 10 Z"/></g></g></svg>');
            background-size: 220px 220px;
            background-repeat: repeat;
        }

        .progresso-container,
        .game-container,
        .tela-inicio {
            position: relative;
            z-index: 1;
        }

        .progresso-container {
            width: 26px;
            background: var(--vidro);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            border: 1.5px solid var(--vidro-borda);
            box-shadow: var(--sombra-premium);
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .progresso-barra {
            width: 100%;
            height: 0%;
            background-image: var(--gradiente-principal);
            transition: height 0.5s ease-in-out;
            border-radius: 15px;
            box-shadow: 0 0 16px rgba(255,61,119,0.7);
        }

        h1 {
            display: inline-block;
            font-family: 'Fredoka', cursive;
            background: var(--vidro);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--vidro-borda);
            border-radius: 16px;
            padding: 8px 26px;
            color: #FFF;
            font-size: clamp(22px, 4vh, 38px);
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
            margin: 0 0 10px;
        }

        h2 {
            display: inline-block;
            font-family: 'Fredoka', cursive;
            background: var(--gradiente-principal);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 6px 22px;
            font-size: clamp(22px, 3.6vh, 34px);
            margin: 0 0 14px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.25);
            box-shadow: var(--brilho-rosa);
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .game-container {
            background: var(--vidro);
            backdrop-filter: blur(22px);
            border-radius: 32px;
            padding: 20px 24px;
            width: min(1150px, 92vw);
            max-height: 96vh;
            border: 1.5px solid var(--vidro-borda);
            box-shadow: var(--sombra-premium), inset 0 1px 0 rgba(255,255,255,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Estrelinhas decorativas nos cantos do card */
        .game-container::before,
        .game-container::after {
            content: '✨';
            position: absolute;
            font-size: 30px;
            animation: brilhar 3s ease-in-out infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 6px var(--rosa));
        }
        .game-container::before { top: -14px; left: -10px; }
        .game-container::after { top: -14px; right: -10px; animation-delay: 0.5s; filter: drop-shadow(0 0 6px var(--laranja)); }

        @keyframes brilhar {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50% { transform: rotate(8deg) scale(1.2); }
        }

        .grid-opcoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2vh 2vw;
            width: 100%;
            padding: 6px;
        }

        .cena {
            width: 23vh;
            height: 23vh;
            max-width: 27vw;
            aspect-ratio: 1 / 1;
            perspective: 600px;
            cursor: pointer;
            animation: flutuarPresente 2.4s ease-in-out infinite;
        }

        .cena:nth-child(2) { animation-delay: 0.15s; }
        .cena:nth-child(3) { animation-delay: 0.3s; }
        .cena:nth-child(4) { animation-delay: 0.45s; }
        .cena:nth-child(5) { animation-delay: 0.6s; }
        .cena:nth-child(6) { animation-delay: 0.75s; }

        @keyframes flutuarPresente {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(-3deg); }
        }

        .cartao {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s ease-in-out;
            transform-style: preserve-3d;
        }

        .cartao.virado {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .face-frente {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .face-frente img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 20px rgba(255,61,119,0.35));
            transition: transform 0.2s, filter 0.2s;
        }

        .cena:hover .face-frente img {
            transform: scale(1.1);
            filter: drop-shadow(0 18px 26px rgba(255,140,66,0.55));
        }

        .face-costas {
            background-color: white;
            border-radius: 25px;
            border: none;
            box-shadow: 0 15px 30px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.9);
            transform: rotateY(180deg);
            color: #333;
            text-shadow: none;
            overflow: hidden;
        }

        .face-costas img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Mantém o texto de descrição invisível para deixar só a foto */
        .face-costas p {
            display: none !important;
        }

        /* --- TELA INICIAL: CADASTRO DOS 3 JOGADORES --- */
        .tela-inicio {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-inicio {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(24px);
            border-radius: 32px;
            border: 1.5px solid var(--vidro-borda);
            padding: 30px 32px;
            max-width: 460px;
            width: 92%;
            box-shadow: var(--sombra-premium);
            text-align: center;
        }

        .campo-jogador {
            margin-bottom: 16px;
            text-align: left;
        }

        .campo-jogador input {
            width: 100%;
            padding: 11px 16px;
            border-radius: 14px;
            border: 2px solid var(--vidro-borda);
            background: rgba(255,255,255,0.08);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .campo-jogador input::placeholder {
            color: rgba(255,255,255,0.55);
        }

        .campo-jogador input:focus {
            border-color: var(--rosa-clara);
            box-shadow: 0 0 0 4px rgba(255,61,119,0.25);
        }

        .historico-mini {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
            min-height: 14px;
            color: var(--laranja-clara);
        }

        .historico-mini .sem-historico {
            opacity: 0.65;
            font-style: italic;
            color: white;
        }

        .botao-comecar {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: var(--gradiente-principal);
            color: white;
            font-family: 'Fredoka', cursive;
            font-weight: 700;
            font-size: 19px;
            cursor: pointer;
            box-shadow: var(--brilho-rosa);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .botao-comecar:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 34px -6px rgba(255,61,119,0.7);
        }

        .botao-comecar:active {
            transform: translateY(1px);
        }

        /* --- BOTÃO DE MÚSICA --- */
        .botao-musica {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 60;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1.5px solid var(--vidro-borda);
            background: var(--vidro);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--sombra-premium);
            transition: transform 0.15s;
        }

        .botao-musica:active {
            transform: scale(0.92);
        }

        /* --- PLACAR E INDICADOR DE VEZ --- */
        .placar {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: min(360px, 90%);
            margin-bottom: 10px;
            background: var(--vidro);
            border: 1.5px solid var(--vidro-borda);
            border-radius: 18px;
            padding: 10px 14px;
            backdrop-filter: blur(10px);
        }

        .placar-titulo {
            font-family: 'Fredoka', cursive;
            font-size: 14px;
            letter-spacing: 1px;
            opacity: 0.85;
            margin-bottom: 2px;
        }

        .linha-placar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
        }

        .linha-placar .nome-jogador-placar {
            display: flex;
            align-items: center;
            gap: 6px;
            text-align: left;
        }

        .linha-placar.vez-atual {
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .linha-placar.lider {
            background: var(--gradiente-principal);
            box-shadow: var(--brilho-rosa);
            transform: scale(1.04);
        }

        .coroa-lider {
            animation: balancarCoroa 1.4s ease-in-out infinite;
        }

        @keyframes balancarCoroa {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        /* --- TOAST DE PONTOS GANHOS/PERDIDOS --- */
        .toast-pontos {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            z-index: 40;
            font-family: 'Fredoka', cursive;
            font-size: clamp(24px, 5vh, 46px);
            font-weight: 700;
            padding: 10px 26px;
            border-radius: 20px;
            pointer-events: none;
            text-shadow: 0 3px 10px rgba(0,0,0,0.4);
            animation: toastPontos 1.7s ease-out forwards;
            white-space: nowrap;
        }

        .toast-pontos.positivo {
            background: linear-gradient(135deg, #FF3D77, #FFD700);
            color: white;
            box-shadow: 0 0 40px rgba(255,215,0,0.6);
        }

        .toast-pontos.negativo {
            background: linear-gradient(135deg, #6b1a3a, #a83232);
            color: white;
            box-shadow: 0 0 30px rgba(168,50,50,0.6);
        }

        @keyframes toastPontos {
            0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
            30% { transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(0.9); }
        }

        /* --- TOAST DE NOVO LÍDER --- */
        .toast-lider {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 55;
            font-family: 'Fredoka', cursive;
            font-size: 18px;
            font-weight: 700;
            padding: 8px 22px;
            border-radius: 30px;
            background: linear-gradient(135deg, #FFD700, #FF3D77);
            color: white;
            box-shadow: 0 8px 26px rgba(255,215,0,0.5);
            animation: toastLider 2.4s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes toastLider {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-14px); }
        }

        /* --- TELA DE VITÓRIA / EMPATE --- */
        .tela-resultado {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            animation: entradaResultado 0.8s cubic-bezier(0.2, 1.4, 0.4, 1);
        }

        @keyframes entradaResultado {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        .trofeu-grande {
            font-size: clamp(50px, 10vh, 90px);
            filter: drop-shadow(0 0 25px #FFD700) drop-shadow(0 0 45px rgba(255,61,119,0.6));
            animation: brilharTrofeu 1.8s ease-in-out infinite;
        }

        @keyframes brilharTrofeu {
            0%, 100% { transform: scale(1) rotate(-3deg); }
            50% { transform: scale(1.08) rotate(3deg); }
        }

        .texto-parabens {
            font-family: 'Fredoka', cursive;
            font-size: clamp(18px, 3vh, 26px);
            letter-spacing: 3px;
            color: #FFD700;
            text-shadow: 0 0 12px rgba(255,215,0,0.6);
            margin-top: 4px;
        }

        .nome-vencedor {
            font-family: 'Fredoka', cursive;
            font-size: clamp(36px, 9vh, 72px);
            font-weight: 700;
            background: linear-gradient(135deg, #FF3D77, #C9A6FF, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(255,61,119,0.4);
            line-height: 1.1;
            margin: 4px 0;
            animation: entradaNome 0.9s cubic-bezier(0.2, 1.6, 0.4, 1);
        }

        @keyframes entradaNome {
            0% { opacity: 0; transform: scale(0.3); }
            60% { opacity: 1; transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .texto-ganhou {
            font-family: 'Fredoka', cursive;
            font-size: clamp(20px, 4vh, 30px);
            color: white;
            margin-bottom: 6px;
        }

        .texto-empate {
            font-family: 'Fredoka', cursive;
            font-size: clamp(26px, 5vh, 40px);
            color: #FFD700;
            text-shadow: 0 0 16px rgba(255,215,0,0.6);
        }

        .nomes-empate {
            font-family: 'Fredoka', cursive;
            font-size: clamp(22px, 5vh, 40px);
            background: linear-gradient(135deg, #C9A6FF, #FF3D77);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 6px 0;
        }

        .pontuacao-final {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .linha-ranking.ranking-1 {
            background: linear-gradient(135deg, #FFD700, #FF3D77);
            color: white;
            font-size: 23px;
            box-shadow: 0 0 30px rgba(255,215,0,0.55);
            transform: scale(1.05);
        }

        .botoes-finais {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .botao-novo-jogo {
            padding: 13px 24px;
            border: 1.5px solid var(--vidro-borda);
            border-radius: 16px;
            background: var(--vidro);
            backdrop-filter: blur(10px);
            color: white;
            font-family: 'Fredoka', cursive;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }

        .botao-novo-jogo:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-2px);
        }

        /* --- EMOJIS FLUTUANTES (efeito de presente "pobre") --- */
        .emoji-flutuante {
            position: absolute;
            top: 50%;
            font-size: 34px;
            pointer-events: none;
            z-index: 35;
            animation: emojiSobe 1.3s ease-out forwards;
        }

        @keyframes emojiSobe {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(0deg); }
            15% { opacity: 1; transform: translate(-50%, -70%) scale(1.15) rotate(-12deg); }
            100% { opacity: 0; transform: translate(-50%, -180%) scale(1) rotate(12deg); }
        }

        .vez-jogador {
            display: inline-block;
            font-family: 'Fredoka', cursive;
            background: var(--gradiente-suave);
            color: white;
            border-radius: 14px;
            padding: 5px 18px;
            font-size: 16px;
            margin-bottom: 10px;
            box-shadow: var(--brilho-rosa);
        }

        /* --- TELA FINAL: RANKING --- */
        .ranking-final {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .linha-ranking {
            background: rgba(255,255,255,0.95);
            color: #2b0f3a;
            border-radius: 14px;
            padding: 10px 28px;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 10px 26px rgba(0,0,0,0.3);
        }

        .botao-jogar-novamente {
            margin-top: 10px;
            padding: 13px 28px;
            border: none;
            border-radius: 16px;
            background: var(--gradiente-principal);
            color: white;
            font-family: 'Fredoka', cursive;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--brilho-rosa);
            transition: transform 0.15s;
        }

        .botao-jogar-novamente:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="textura-fundo"></div>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- Música de fundo: troque o arquivo abaixo pela sua musiquinha infantil -->
    <audio id="musicaFundo" loop preload="auto">

        // ===== HISTÓRICO DE PONTUAÇÕES (salvo no navegador) =====
        const CHAVE_HISTORICO = 'jogoPresentesHistorico';

        function salvarHistorico(nome, pontos) {
            let dados = JSON.parse(localStorage.getItem(CHAVE_HISTORICO) || '{}');
            if (!dados[nome]) dados[nome] = [];
            dados[nome].push({ pontos: pontos, data: new Date().toLocaleString('pt-BR') });
            localStorage.setItem(CHAVE_HISTORICO, JSON.stringify(dados));
        }

        function obterHistorico(nome) {
            let dados = JSON.parse(localStorage.getItem(CHAVE_HISTORICO) || '{}');
            return dados[nome] || [];
        }

        function atualizarHistoricoMini(inputEl, divEl) {
            const nome = inputEl.value.trim();
            if (!nome) { divEl.innerHTML = ''; return; }
            const hist = obterHistorico(nome);
            if (hist.length === 0) {
                divEl.innerHTML = '<span class="sem-historico">Primeira vez jogando! ✨</span>';
                return;
            }
            divEl.innerHTML = 'Partidas anteriores: ' + hist.map(h => `${h.pontos} pts (${h.data})`).join(' • ');
        }

        // ===== MÚSICA DE FUNDO E EFEITOS SONOROS =====
        const musicaFundo = document.getElementById('musicaFundo');
        const somPresenteRico = document.getElementById('somPresenteRico');
        const somPresentePobre = document.getElementById('somPresentePobre');
        const somGanhador = document.getElementById('somGanhador');

        const VOLUME_MUSICA_NORMAL = 0.35;
        const VOLUME_MUSICA_REDUZIDO = 0.08;

        musicaFundo.volume = VOLUME_MUSICA_NORMAL;
        let musicaLigada = true;

        function tocarMusica() {
            if (!musicaLigada) return;
            musicaFundo.play().catch(() => {
                // Se o navegador bloquear, o botão continua disponível pra ligar manualmente
            });
        }

        function alternarMusica() {
            musicaLigada = !musicaLigada;
            const botao = document.getElementById('botaoMusica');
            if (musicaLigada) {
                musicaFundo.play().catch(() => {});
                botao.innerText = '🔊';
            } else {
                musicaFundo.pause();
                botao.innerText = '🔇';
            }
        }

        // Toca um efeito sonoro reduzindo a música de fundo enquanto ele dura,
        // voltando ao volume normal automaticamente quando termina
        function tocarEfeitoComDuck(audioEl) {
            musicaFundo.volume = VOLUME_MUSICA_REDUZIDO;
            audioEl.currentTime = 0;
            audioEl.play().catch(() => {
                // Se o áudio não puder tocar (arquivo ausente, navegador bloqueando), 
                // devolve o volume da música pra não ficar baixo pra sempre
                musicaFundo.volume = VOLUME_MUSICA_NORMAL;
            });

            audioEl.onended = () => {
                musicaFundo.volume = VOLUME_MUSICA_NORMAL;
            };
        }

        // Chuva de emojis flutuantes (usado no presente "pobre")
        function emojiFlutuante(emoji, quantidade) {
            const container = document.getElementById('gameContainer');
            for (let i = 0; i < quantidade; i++) {
                const el = document.createElement('span');
                el.className = 'emoji-flutuante';
                el.innerText = emoji;
                const offsetX = (Math.random() - 0.5) * 340;
                const offsetY = (Math.random() - 0.5) * 60;
                el.style.left = `calc(50% + ${offsetX}px)`;
                el.style.top = `calc(50% + ${offsetY}px)`;
                el.style.fontSize = (26 + Math.random() * 16) + 'px';
                el.style.animationDelay = (Math.random() * 0.35) + 's';
                container.appendChild(el);
                setTimeout(() => el.remove(), 1700);
            }
        }

        // ===== ESTADO DO JOGO =====

        // Configuração de pontuação — mude aqui se quiser outros valores
        const PONTOS_RICO = 10;
        const PONTOS_POBRE = -5;

        let jogadores = [];
        let pontuacoes = {};
        let turnoAtual = 0;
        let indiceRodada = 0;
        let podeClicar = true;
        let liderAtual = null;

        function iniciarJogo() {
            const nomes = [
                document.getElementById('nomeJogador1').value.trim() || 'Jogador 1',
                document.getElementById('nomeJogador2').value.trim() || 'Jogador 2',
                document.getElementById('nomeJogador3').value.trim() || 'Jogador 3'
            ];

            jogadores = nomes;
            iniciarPartida();
        }

        // Reinicia a partida mantendo os mesmos 3 jogadores já cadastrados
        function jogarNovamente() {
            iniciarPartida();
        }

        function iniciarPartida() {
            pontuacoes = {};
            jogadores.forEach(n => pontuacoes[n] = 0);
            turnoAtual = 0;
            indiceRodada = 0;
            liderAtual = null;

            document.getElementById('telaInicio').style.display = 'none';
            document.getElementById('progressoContainer').style.display = 'flex';
            document.getElementById('gameContainer').style.display = 'flex';
            document.getElementById('rankingFinal').style.display = 'none';
            document.getElementById('resultadoFinal').innerHTML = '';
            document.getElementById('listaRanking').innerHTML = '';
            document.querySelector('.grid-opcoes').style.display = 'flex';
            document.getElementById('vezJogador').style.display = 'inline-block';
            document.getElementById('item-atual').style.display = 'inline-block';
            document.getElementById('perguntaJogo').innerText = 'Qual presente você quer abrir?';
            document.getElementById('perguntaJogo').style.display = 'inline-block';

            tocarMusica();

            prepararRodada();
        }

        function atualizarPlacar() {
            const maiorPontuacao = Math.max(...jogadores.map(n => pontuacoes[n]));
            const temLiderUnico = maiorPontuacao > 0 && jogadores.filter(n => pontuacoes[n] === maiorPontuacao).length === 1;
            const nomeLider = temLiderUnico ? jogadores.find(n => pontuacoes[n] === maiorPontuacao) : null;

            // Detecta troca de liderança pra mostrar o aviso, sem interromper o jogo
            if (nomeLider && nomeLider !== liderAtual) {
                mostrarToastLider(nomeLider);
            }
            liderAtual = nomeLider;

            const ordenado = [...jogadores].sort((a, b) => pontuacoes[b] - pontuacoes[a]);

            const placar = document.getElementById('placar');
            placar.innerHTML =
                '<div class="placar-titulo">🏆 PLACAR</div>' +
                ordenado.map(nome => {
                    const ehLider = nome === nomeLider;
                    const ehVez = nome === jogadores[turnoAtual];
                    return `<div class="linha-placar ${ehLider ? 'lider' : ''} ${ehVez && !ehLider ? 'vez-atual' : ''}">
                        <span class="nome-jogador-placar">${ehLider ? '<span class="coroa-lider">👑</span>' : ''}${nome}</span>
                        <span>${pontuacoes[nome]} PONTOS</span>
                    </div>`;
                }).join('');
        }

        function mostrarToastLider(nome) {
            const toast = document.createElement('div');
            toast.className = 'toast-lider';
            toast.innerText = `👑 NOVO LÍDER: ${nome}!`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2400);
        }

        function mostrarToastPontos(delta) {
            const toast = document.createElement('div');
            toast.className = 'toast-pontos ' + (delta > 0 ? 'positivo' : 'negativo');
            toast.innerText = (delta > 0 ? '+' : '') + delta + ' PONTOS! ' + (delta > 0 ? '🎉' : '😱');
            document.getElementById('gameContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 1700);
        }

        function prepararRodada() {
            let rodadaAtual = rodadas[indiceRodada];

            document.getElementById("item-atual").innerText = rodadaAtual.titulo;
            document.getElementById("barra").style.height = ((indiceRodada / rodadas.length) * 100) + "%";
            document.getElementById('vezJogador').innerText = '🎮 Vez de: ' + jogadores[turnoAtual];
            atualizarPlacar();

            let cores = ['azul', 'rosa', 'dourado', 'branco', 'preto', 'arcoiris'];
            let opcoesEmbaralhadas = [...rodadaAtual.opcoes].sort(() => Math.random() - 0.5);

            cores.forEach((cor, index) => {
                let imgElement = document.getElementById("img-" + cor);
                let opcaoSorteada = opcoesEmbaralhadas[index];
                
                imgElement.src = opcaoSorteada.img;
                imgElement.parentElement.dataset.status = opcaoSorteada.status;
            });

            setTimeout(() => {
                podeClicar = true;
            }, 400); 
        }

        function abrirPresente(cor, elementoCena) {
            if (!podeClicar) return;
            podeClicar = false; 

            let cartao = elementoCena.querySelector(".cartao");
            cartao.classList.add("virado");

            let status = elementoCena.querySelector(".face-costas").dataset.status;
            let jogadorDaVez = jogadores[turnoAtual];

            const delta = status === "rico" ? PONTOS_RICO : PONTOS_POBRE;
            pontuacoes[jogadorDaVez] = Math.max(0, pontuacoes[jogadorDaVez] + delta);
            mostrarToastPontos(delta);

            if (status === "rico") {
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });
                tocarEfeitoComDuck(somPresenteRico);
            } else {
                emojiFlutuante('👎', 18);
                tocarEfeitoComDuck(somPresentePobre);
            }
            atualizarPlacar();

            // Deixa a carta virada por 3 segundos
            setTimeout(() => {
                cartao.classList.remove("virado");

                // Espera a carta terminar de girar totalmente para só então mudar de rodada (CORREÇÃO DO BUG)
                cartao.addEventListener('transitionend', function handler() {
                    cartao.removeEventListener('transitionend', handler);

                    turnoAtual++;
                    if (turnoAtual >= jogadores.length) {
                        turnoAtual = 0;
                        indiceRodada++;
                    }

                    if (indiceRodada >= rodadas.length) {
                        finalizarJogo();
                    } else {
                        prepararRodada();
                    }
                });

            }, 3000); 
        }

        function finalizarJogo() {
            document.getElementById("item-atual").style.display = "none";
            document.querySelector(".grid-opcoes").style.display = "none";
            document.getElementById("vezJogador").style.display = "none";
            document.getElementById("perguntaJogo").style.display = "none";
            document.getElementById("barra").style.height = "100%";

            const maiorPontuacao = Math.max(...jogadores.map(n => pontuacoes[n]));
            const vencedores = jogadores.filter(n => pontuacoes[n] === maiorPontuacao);
            const ranking = [...jogadores].sort((a, b) => pontuacoes[b] - pontuacoes[a]);
            const medalhas = ['🥇', '🥈', '🥉'];

            let htmlResultado;
            if (vencedores.length === 1) {
                htmlResultado = `
                    <div class="tela-resultado">
                        <div class="trofeu-grande">🏆</div>
                        <div class="texto-parabens">PARABÉNS!</div>
                        <div class="nome-vencedor">${vencedores[0]}</div>
                        <div class="texto-ganhou">GANHOU! 🎉</div>
                        <div class="pontuacao-final">Pontuação final: ${maiorPontuacao} pontos</div>
                    </div>`;
            } else {
                htmlResultado = `
                    <div class="tela-resultado">
                        <div class="trofeu-grande">🏆</div>
                        <div class="texto-empate">EMPATE!</div>
                        <div class="nomes-empate">${vencedores.join(' & ')}</div>
                        <div class="pontuacao-final">Pontuação final: ${maiorPontuacao} pontos</div>
                    </div>`;
            }
            document.getElementById('resultadoFinal').innerHTML = htmlResultado;

            document.getElementById('listaRanking').innerHTML = ranking.map((nome, i) =>
                `<div class="linha-ranking ${i === 0 ? 'ranking-1' : ''}">${medalhas[i]} ${i + 1}º — ${nome} — ${pontuacoes[nome]} ${pontuacoes[nome] === 1 ? 'ponto' : 'pontos'}</div>`
            ).join('');

            ranking.forEach(nome => salvarHistorico(nome, pontuacoes[nome]));

            document.getElementById('rankingFinal').style.display = 'flex';

            tocarEfeitoComDuck(somGanhador);

            confetti({ particleCount: 150, spread: 100, origin: { y: 0.4 }, colors: ['#FF3D77', '#C9A6FF', '#FFD700', '#ffffff'] });

            var duration = 5 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#FF3D77', '#C9A6FF', '#FFD700'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#FF3D77', '#C9A6FF', '#FFD700'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        function voltarInicio() {
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('progressoContainer').style.display = 'none';
            document.getElementById('telaInicio').style.display = 'flex';
            document.getElementById('perguntaJogo').style.display = 'inline-block';

            ['1', '2', '3'].forEach(n => {
                const input = document.getElementById('nomeJogador' + n);
                const historico = document.getElementById('historico' + n);
                input.value = '';
                atualizarHistoricoMini(input, historico);
            });
        }
    </script>
</body>
</html>
